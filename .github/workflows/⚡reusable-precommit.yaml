name: Pre-Commit

on:
  workflow_call:
    inputs:
      atomi_platform:
        required: true
        type: string
      atomi_service:
        required: true
        type: string

jobs:
  precommit:
    name: Pre-Commit
    runs-on: ubuntu-24.04
    steps:
      # Setup — dogfood the local action: `uses: ./` needs the repo present first,
      # and pinning a released tag here is circular (a broken release would wedge
      # the CI that gates the next release).
      - uses: actions/checkout@v6
      - uses: ./
        with:
          namespacelabels: 'false'
          checkout: 'false'
          attic: 'false'
      - uses: AtomiCloud/actions.cache-nuget@v1
        with:
          namespacelabs: 'false'

      # Pre Commit
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/pre-commit.sh
