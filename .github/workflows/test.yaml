name: Test

on:
  push:

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GitHub Linux amd64
            runner:
              - ubuntu-latest
            namespacelabs: 'false'
          - name: GitHub Linux arm64
            runner:
              - ubuntu-24.04-arm
            namespacelabs: 'false'
          - name: GitHub macOS arm64
            runner:
              - macos-latest
            namespacelabs: 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      # uses: ./ needs the repo present before the action runs, so check out here
      # and disable the action's own checkout.
      - uses: actions/checkout@v6
      - name: Deepen current ref (nix needs revCount)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --tags origin "$(git rev-parse HEAD)"
          fi
      - uses: ./
        with:
          checkout: 'false'
          namespacelabs: ${{ matrix.namespacelabs }}

      - name: Verify Determinate Nix + lazy-trees
        run: |
          set -euo pipefail
          nix --version
          nix --version | grep -q "Determinate Nix"
          lazy="$(nix config show lazy-trees)"
          echo "lazy-trees = $lazy"
          [ "$lazy" = "true" ]

      - name: Time devshell evals (2nd should be eval-cache warm)
        run: |
          set -euo pipefail
          time nix develop .#ci -c true
          time nix develop .#ci -c true

      - name: durian-shell matches nix develop
        shell: bash
        run: |
          set -euo pipefail
          norm() { sed -E 's#nix-shell\.[A-Za-z0-9]+#nix-shell.X#g; s#nix-develop-[0-9]+-[0-9]+#nix-develop.X#g' | grep -vE '^(_|SHLVL|OLDPWD)=' | sort; }
          # The cache is opt-in (setup-nix sets this only on Namespace Linux); GitHub-hosted Linux opts in
          # here to exercise the cached path, macOS stays on the plain `nix develop` fall-through.
          if [ "$RUNNER_OS" = "Linux" ]; then export DURIAN_SHELL_CACHE=1; fi
          nix develop .#ci -c env | norm > /tmp/env-nix-develop.txt
          durian-shell .#ci -c env | norm > /tmp/env-first.txt
          durian-shell .#ci -c env | norm > /tmp/env-second.txt
          diff /tmp/env-nix-develop.txt /tmp/env-first.txt
          diff /tmp/env-nix-develop.txt /tmp/env-second.txt
          DURIAN_SHELL_VERIFY=1 durian-shell .#ci -c true
          rc=0
          durian-shell .#ci -c bash -c 'exit 7' || rc=$?
          [ "$rc" -eq 7 ]
          # a warm-only call that falls through (here: cache off) must not run the command or the hook
          DURIAN_SHELL_WARM_ONLY=1 DURIAN_SHELL_CACHE=0 durian-shell .#ci -c touch "$RUNNER_TEMP/warm-ran"
          [ ! -e "$RUNNER_TEMP/warm-ran" ]
          echo "durian-shell is equivalent to nix develop"

      # Deprecated v3.7.0 name: bin/atomi-develop maps ATOMI_DEVENV_* to DURIAN_SHELL_* (an
      # explicitly set old name wins), prints one deprecation line on stderr and execs
      # durian-shell. Goes away with the shim in v4.
      - name: atomi-develop shim (deprecated name)
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          atomi-develop .#ci -c bash -c 'exit 7' 2>/tmp/shim-err.txt || rc=$?
          [ "$rc" -eq 7 ]
          [ "$(grep -c '^\[atomi-develop\] deprecated: renamed to durian-shell' /tmp/shim-err.txt)" -eq 1 ]
          if [ "$RUNNER_OS" = "Linux" ]; then
            export DURIAN_SHELL_CACHE=1
            ATOMI_DEVENV_DIR="$RUNNER_TEMP/shim" atomi-develop .#ci -c true 2>&1 | tee /tmp/shim1.txt
            grep -q '^\[durian-shell\] miss ' /tmp/shim1.txt
            [ "$(find "$RUNNER_TEMP/shim" -name '*.sh' | wc -l)" -eq 1 ]
            ATOMI_DEVENV_DIR="$RUNNER_TEMP/shim" atomi-develop .#ci -c true 2>&1 | tee /tmp/shim2.txt
            grep -q '^\[durian-shell\] hit ' /tmp/shim2.txt
            ATOMI_DEVENV_CACHE=0 ATOMI_DEVENV_DIR="$RUNNER_TEMP/shim" atomi-develop .#ci -c true 2>&1 | tee /tmp/shim3.txt
            if grep -q '^\[durian-shell\]' /tmp/shim3.txt; then exit 1; fi
          fi
          echo "atomi-develop shim ok"

      # devshell-prewarm: `durian-shell --warm` stores every listed shell, runs nothing,
      # never fails the caller, and is a no-op with the cache off.
      - name: durian-shell --warm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export DURIAN_SHELL_CACHE=1 DURIAN_SHELL_DIR="$RUNNER_TEMP/warm-test"
          durian-shell --warm .#ci .#no-such-shell
          [ "$(find "$DURIAN_SHELL_DIR" -name '*.sh' | wc -l)" -eq 1 ]
          durian-shell --warm .#ci 2>&1 | tee /tmp/warm2.txt
          grep -q '^\[durian-shell\] hit ' /tmp/warm2.txt
          durian-shell .#ci -c true 2>&1 | tee /tmp/run.txt
          grep -q '^\[durian-shell\] hit ' /tmp/run.txt
          # a keep limit below the list length must not evict a shell the pass just stored
          DURIAN_SHELL_KEEP=1 DURIAN_SHELL_DIR="$RUNNER_TEMP/warm-keep" durian-shell --warm .#ci .#releaser
          [ "$(find "$RUNNER_TEMP/warm-keep" -name '*.sh' | wc -l)" -eq 2 ]
          DURIAN_SHELL_CACHE=0 DURIAN_SHELL_DIR="$RUNNER_TEMP/warm-off" durian-shell --warm .#ci
          [ ! -e "$RUNNER_TEMP/warm-off" ]
          echo "durian-shell --warm ok"

      # devshell-scope: each scope keeps (and prunes) only its own envs, and every kept env is a
      # registered GC root.
      - name: durian-shell scopes and GC roots
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export DURIAN_SHELL_CACHE=1 DURIAN_SHELL_DIR="$RUNNER_TEMP/scopes" DURIAN_SHELL_KEEP=1
          DURIAN_SHELL_SCOPE=Org/Repo-A durian-shell .#ci -c true
          DURIAN_SHELL_SCOPE=Org/Repo-B durian-shell .#releaser -c true
          DURIAN_SHELL_SCOPE=Org/Repo-B durian-shell .#ci -c true
          # repo B's KEEP=1 pruning dropped its own releaser env, never repo A's
          [ "$(find "$DURIAN_SHELL_DIR"/org-repo-a-* -name '*.sh' | wc -l)" -eq 1 ]
          [ "$(find "$DURIAN_SHELL_DIR"/org-repo-b-* -name '*.sh' | wc -l)" -eq 1 ]
          DURIAN_SHELL_SCOPE=Org/Repo-A durian-shell .#ci -c true 2>&1 | tee /tmp/scope-a.txt
          grep -q '^\[durian-shell\] hit ' /tmp/scope-a.txt
          # pruned envs take their roots with them; kept envs have both roots, registered
          [ "$(find "$DURIAN_SHELL_DIR" -name '*.root' | wc -l)" -eq 4 ]
          for r in "$DURIAN_SHELL_DIR"/*/*.root; do
            [ -e "$r" ]
            find /nix/var/nix/gcroots/auto -lname "$r" | grep -q .
          done
          # an env whose roots are missing gets them back on its next hit
          rm -f "$DURIAN_SHELL_DIR"/org-repo-a-*/*.root
          DURIAN_SHELL_SCOPE=Org/Repo-A durian-shell .#ci -c true
          [ "$(find "$DURIAN_SHELL_DIR"/org-repo-a-* -name '*.root' | wc -l)" -eq 2 ]
          # KEEP off (or 0): nothing is ever pruned
          DURIAN_SHELL_KEEP=off DURIAN_SHELL_SCOPE=Org/Repo-C durian-shell .#ci -c true
          DURIAN_SHELL_KEEP=off DURIAN_SHELL_SCOPE=Org/Repo-C durian-shell .#releaser -c true
          [ "$(find "$DURIAN_SHELL_DIR"/org-repo-c-* -name '*.sh' | wc -l)" -eq 2 ]
          DURIAN_SHELL_KEEP=0 DURIAN_SHELL_SCOPE=Org/Repo-D durian-shell .#ci -c true
          DURIAN_SHELL_KEEP=0 DURIAN_SHELL_SCOPE=Org/Repo-D durian-shell .#releaser -c true
          [ "$(find "$DURIAN_SHELL_DIR"/org-repo-d-* -name '*.sh' | wc -l)" -eq 2 ]
          # scopes that slug alike still get separate folders
          DURIAN_SHELL_SCOPE=Org-Repo/A durian-shell .#ci -c true
          [ "$(find "$DURIAN_SHELL_DIR" -mindepth 1 -maxdepth 1 -name 'org-repo-a-*' | wc -l)" -eq 2 ]
          echo "scopes and roots ok"

      # store guard: size warnings (faked usage), the idle-commit notice, and its switches.
      - name: Store guard warnings and notice
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          g=./scripts/store-guard.sh
          export STORE_GUARD_STATE="$RUNNER_TEMP/sg.state" DURIAN_SHELL_DIR="$RUNNER_TEMP/sg-shells" CACHE_SIZE_GB=10
          mkdir -p "$DURIAN_SHELL_DIR"
          STORE_GUARD_USED_BYTES=$((5 * 1024 ** 3)) $g start | tee /tmp/sg1.txt
          if grep -q '^::' /tmp/sg1.txt; then exit 1; fi
          STORE_GUARD_USED_BYTES=$((9 * 1024 ** 3)) $g start | tee /tmp/sg2.txt
          grep -q '^::warning title=Nix cache volume nearly full::.*90%.*EMPTY volume' /tmp/sg2.txt
          STORE_GUARD_USED_BYTES=$((11 * 1024 ** 3)) $g end | tee /tmp/sg3.txt
          grep -q '^::error title=Nix cache volume over its size::.*NEXT job on this cache tag starts from an EMPTY volume' /tmp/sg3.txt
          grep -q '^::notice title=Cache volume commit adds nothing::.*nscloud-cache-exp-do-not-commit' /tmp/sg3.txt
          IDLE_COMMIT_NOTICE_MINUTES=off STORE_GUARD_USED_BYTES=1 $g end | tee /tmp/sg4.txt
          if grep -q '^::notice' /tmp/sg4.txt; then exit 1; fi
          IDLE_COMMIT_NOTICE_MINUTES=60 STORE_GUARD_USED_BYTES=1 $g end | tee /tmp/sg5.txt
          if grep -q '^::notice' /tmp/sg5.txt; then exit 1; fi
          touch "$DURIAN_SHELL_DIR/new.sh"
          STORE_GUARD_USED_BYTES=1 $g end | tee /tmp/sg6.txt
          if grep -q '^::notice' /tmp/sg6.txt; then exit 1; fi
          echo "store guard warnings ok"

      # flakehub-login: 'false' must skip the warm path's login even when the job has OIDC
      # (stub daemon records the call; the real login is never attempted here).
      - name: Warm-path FlakeHub login switch
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/stub-bin"
          mkdir -p "$stub"
          printf '#!/bin/sh\necho "$*" >> "%s/calls"\nexit 1\n' "$stub" > "$stub/determinate-nixd"
          chmod +x "$stub/determinate-nixd"
          export ATOMI_NIX_BIN_DIR="$stub" ACTIONS_ID_TOKEN_REQUEST_URL=https://example.invalid ACTIONS_ID_TOKEN_REQUEST_TOKEN=x
          FLAKEHUB_LOGIN=false ./scripts/linux-warm-nix.sh flakehub-login
          [ ! -e "$stub/calls" ]
          ./scripts/linux-warm-nix.sh flakehub-login
          [ "$(cat "$stub/calls")" = "login github-action" ]
          echo "flakehub-login switch ok"

      # store-gc-at-percent: a full store GC keeps every path a kept env needs (it runs last:
      # it collects everything else on this runner, flake inputs included).
      - name: Store GC keeps live dev shells
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export DURIAN_SHELL_CACHE=1 DURIAN_SHELL_DIR="$RUNNER_TEMP/gc-shells" DURIAN_SHELL_SCOPE=test/gc
          durian-shell .#ci -c true
          STORE_GUARD_STATE="$RUNNER_TEMP/gc.state" CACHE_SIZE_GB=1 STORE_GC_AT_PERCENT=1 STORE_GC_TARGET_PERCENT=0 \
            ./scripts/store-guard.sh start | tee /tmp/gc.txt
          grep -q '^\[store-guard\] GC done in ' /tmp/gc.txt
          if grep -q 'GC failed' /tmp/gc.txt; then exit 1; fi
          f="$(find "$DURIAN_SHELL_DIR"/test-gc-* -name '*.sh')"
          grep -oE '/nix/store/[a-z0-9]{32}-[A-Za-z0-9._+-]+' "$f" | sort -u | while IFS= read -r p; do
            [ -e "$p" ] || { echo "collected: $p"; exit 1; }
          done
          durian-shell .#ci -c true 2>&1 | tee /tmp/gc-hit.txt
          grep -q '^\[durian-shell\] hit ' /tmp/gc-hit.txt
          echo "store GC kept the live dev shell"

      # Regression guard for the macOS checkout: the workspace must be a loose-ref
      # repo (nix reads git flakes via libgit2, which cannot open reftable), and nix
      # must be able to read it as a git flake.
      - name: Verify workspace is nix-readable git (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          fmt="$(git rev-parse --show-ref-format)"
          echo "ref-format: $fmt"
          [ "$fmt" = "files" ]
          nix flake metadata "git+file://$PWD" > /dev/null
          echo "nix can read the workspace flake"
