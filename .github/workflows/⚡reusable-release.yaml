name: Release

on:
  workflow_call:
    inputs:
      atomi_platform:
        required: true
        type: string
      atomi_service:
        required: true
        type: string

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    steps:
      # Setup — dogfood the local action. A plain checkout makes `uses: ./`
      # resolvable; the action then re-checkouts with the auth-bot token (full
      # history) for semantic-release.
      - uses: actions/checkout@v6
      - uses: ./
        with:
          namespacelabels: 'false'
          auth-bot-app-id: ${{ vars.AUTH_BOT_APP_ID }}
          auth-bot-secret-key: ${{ secrets.AUTH_BOT_SECRET_KEY }}
          attic: 'false'

      - uses: AtomiCloud/actions.cache-npm@v1
        with:
          namespacelabs: 'false'
      - uses: AtomiCloud/actions.cache-nuget@v1
        with:
          namespacelabs: 'false'

      # Release
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop .#releaser -c scripts/release.sh
